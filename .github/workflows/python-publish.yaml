# Publishes the package to PyPI when a GitHub Release is created.
#
# Uses PyPI Trusted Publishing (OIDC): no long-lived API token is stored. The
# project must register this repository + workflow as a trusted publisher at
# https://pypi.org/manage/project/jet-for-pytorch/settings/publishing/ with:
#   owner = f-dangel, repo = torch-jet,
#   workflow = python-publish.yaml, environment = pypi

name: Upload Python Package

on:
  release:
    types: [created]

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs the tags to derive the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import jet; print('imported jet', jet.__all__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
