name: Test

on: [push, pull_request]


jobs:
  tests:
    name: "${{ matrix.suite }} / Python ${{ matrix.python-version }} / torch ${{ matrix.torch-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        torch-version: ["2.10.*", ""]  # "" installs the latest torch
        suite: ["unit", "models"]  # unit: `-m "not models"` + doctest; models: `-m models`
        # torchvision pins torch exactly, so pin it with the matching release
        include:
          - torch-version: "2.10.*"
            torchvision-version: "0.25.*"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "${{ matrix.python-version }}"
        cache: pip
    - name: Install graphviz
      run: sudo apt-get update && sudo apt-get install -y graphviz
    - name: Install torch ${{ matrix.torch-version || 'latest' }}
      run: |
        python -m pip install --upgrade pip
        if [ -n "${{ matrix.torch-version }}" ]; then
          python -m pip install "torch==${{ matrix.torch-version }}" "torchvision==${{ matrix.torchvision-version }}"
        fi
    - name: Install Dependencies
      run: |
        make install-test
    - name: Run ${{ matrix.suite }} tests
      run: |
        make test-${{ matrix.suite }}
    - name: Run doctest
      if: matrix.suite == 'unit'
      run: |
        make doctest
